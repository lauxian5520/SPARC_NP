[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparc-np"
version = "1.0.0"
description = "SPARC-NP：化学域偏移下的选择性预测与类比检索（天然产物活性建模）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 训练依赖 —— 在装有 CUDA 的服务器上安装
train = [
    "torch>=2.2",
    "transformers>=4.40",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]
# 化学管线（RDKit 在 aarch64 上不可靠，只在服务器安装）
chem = ["rdkit>=2024.03.1"]
# 可选检索加速
ann = ["hnswlib>=0.8"]
# 图神经网络（仅 MolCLR 适配器需要）
graph = ["torch-geometric>=2.5"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["sparc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_torch: 需要 PyTorch（服务器）",
    "requires_rdkit: 需要 RDKit（服务器）",
    "requires_data: 需要已构建的 Stage 0 产物",
    "slow: 耗时较长",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "SIM"]
ignore = ["D203", "D213", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"
